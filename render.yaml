services:
  - type: web
    name: unifi-aoc-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run-backend.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: UI_CLOUD_API_KEY
        sync: false # secret - set manually in the Render dashboard, not committed
